name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpp:
    name: C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # Ninja from PyPI (pipx is preinstalled on GitHub runners): one step for both OSes,
      # and no dependency on apt mirrors, which failed to resolve on 2026-11-11.
      - name: Install Ninja
        run: pipx install ninja
      - run: cmake --preset dev
      - run: cmake --build --preset dev
      - run: ctest --preset dev

  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  docker:
    name: Docker image (x86_64, like the VM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ppm:ci .
      # The image must start and load the compiled C++ extension.
      - run: docker run --rm ppm:ci --help
      - run: docker run --rm --entrypoint python ppm:ci -c "import ppm_core; print(ppm_core.version())"
      - run: docker compose config --quiet
